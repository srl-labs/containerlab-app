[project]
name = "containerlab-app-docs"
version = "0.1.0"
description = "Containerlab Apps documentation and topology Markdown extension"
requires-python = ">=3.11"
dependencies = ["zensical==0.0.62", "pyyaml>=6.0.2", "pygments>=2.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/clab_docs"]
