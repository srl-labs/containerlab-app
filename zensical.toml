[project]
site_name = "Containerlab Apps"
site_description = "Design networks. Explore every connection. Documentation for the Containerlab web, desktop, and VS Code apps."
site_url = "https://srl-labs.github.io/containerlab-app/docs/"
repo_url = "https://github.com/srl-labs/containerlab-app"
repo_name = "srl-labs/containerlab-app"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
# External fence inputs must invalidate Markdown cached by Zensical.
watch = ["docs/examples", "tools/clab_docs/topology.py"]
copyright = "Containerlab Apps · Open source. Built for network people."
extra_css = ["assets/stylesheets/site.css", "assets/viewer/component.css"]
extra_javascript = ["assets/viewer/component.mjs"]
nav = [
  { "Overview" = "index.md" },
  { "Get started" = [
    { "Choose your app" = "getting-started/index.md" },
    { "Your first lab" = "getting-started/first-lab.md" },
    { "VS Code" = "manual/gui/vsc-extension.md" },
    { "Web app" = "manual/gui/web.md" },
    { "Desktop app" = "manual/gui/desktop.md" },
    { "Connect a lab host" = "manual/api-server.md" },
  ] },
  { "User guide" = [
    { "The shared workspace" = "manual/gui/index.md" },
    { "Design a topology" = "guides/topologies.md" },
    { "Containerlab reference" = "https://containerlab.dev/manual/topo-def-file/" },
  ] },
  { "Topology gallery" = [
    { "Explore the examples" = "examples/index.md" },
    { "Leaf–spine fabric" = "examples/fabric.md" },
    { "Linux playground" = "examples/linux.md" },
  ] },
  { "Build with the viewer" = [
    { "Interactive documentation" = "viewer/index.md" },
    { "Component reference" = "viewer/reference.md" },
    { "Contributing to the docs" = "contributing.md" },
  ] },
]

[project.theme]
variant = "modern"
custom_dir = "docs-overrides"
logo = "assets/images/mark.svg"
favicon = "assets/images/mark.svg"
font = false
features = ["navigation.tabs", "navigation.tabs.sticky", "navigation.sections", "navigation.indexes", "navigation.instant", "navigation.instant.progress", "navigation.top", "navigation.footer", "toc.follow", "content.code.copy", "content.tabs.link", "search.highlight", "search.suggest"]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle = { icon = "lucide/sun", name = "Switch to light mode" }

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle = { icon = "lucide/moon", name = "Switch to dark mode" }

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc = { permalink = true }
"clab_docs.topology" = {}
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.superfences" = {}
"pymdownx.inlinehilite" = {}
"pymdownx.details" = {}
"pymdownx.tabbed" = { alternate_style = true }
"pymdownx.blocks.admonition" = {}
"pymdownx.blocks.details" = {}
"pymdownx.blocks.tab" = { alternate_style = true }
"pymdownx.keys" = {}
"pymdownx.emoji" = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }
