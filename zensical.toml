[project]
site_name = "Containerlab Apps"
site_description = "The GUI for containerlab. Design, deploy, and troubleshoot network labs in VS Code, on your desktop, or in your browser."
site_url = "https://srl-labs.github.io/containerlab-app/docs/"
repo_url = "https://github.com/srl-labs/containerlab-app"
repo_name = "srl-labs/containerlab-app"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
# External fence inputs must invalidate Markdown cached by Zensical.
watch = ["docs/examples", "docs/diagrams", "tools/clab_docs/topology.py"]
copyright = "Containerlab Apps · Open source. Built for network people."
extra_css = ["assets/stylesheets/site.css", "assets/viewer/component.css", "assets/stylesheets/customization.css"]
# The template loads this asynchronously in the head, ahead of the docs bundle.
extra_javascript = []
nav = [
  { "Overview" = "index.md" },
  { "Get started" = [
    { "Choose an app" = "getting-started/index.md" },
    { "Quick start" = "getting-started/first-lab.md" },
    { "How it works" = "getting-started/how-it-works.md" },
  ] },
  { "Install" = [
    { "VS Code extension" = "install/vscode.md" },
    { "Desktop app" = "install/desktop.md" },
    { "Web app" = "install/web.md" },
    { "Lab host" = "install/lab-host.md" },
    { "Sign in to a lab host" = "install/sign-in.md" },
  ] },
  { "Guides" = [
    { "Tour the workspace" = "guides/workspace.md" },
    { "Build a topology" = "guides/topologies.md" },
    { "Node templates" = "guides/templates.md" },
    { "Layout and style" = "guides/appearance.md" },
    { "Run a lab" = "guides/labs.md" },
    { "Troubleshoot" = "guides/troubleshooting.md" },
    { "Shared labs" = "guides/shared-labs.md" },
    { "Export" = "guides/export.md" },
    { "Keyboard shortcuts" = "guides/shortcuts.md" },
  ] },
  { "Examples" = [
    { "Gallery" = "examples/index.md" },
    { "Leaf–spine fabric" = "examples/fabric.md" },
    { "Linux playground" = "examples/linux.md" },
  ] },
  { "Reference" = [
    { "VS Code settings" = "reference/vscode-settings.md" },
    { "Web and desktop settings" = "reference/app-settings.md" },
    { "API server settings" = "reference/api-server.md" },
  ] },
  { "Embed the viewer" = [
    { "Overview" = "viewer/standalone.md" },
    { "In Zensical" = "viewer/index.md" },
    { "Customization studio" = "viewer/customize.md" },
    { "Component reference" = "viewer/reference.md" },
  ] },
  { "Project" = [
    { "Contribute to the docs" = "contributing.md" },
    { "Releases" = "https://github.com/srl-labs/containerlab-app/releases" },
    { "Containerlab manual" = "https://containerlab.dev/" },
    { "Discord" = "https://discord.gg/vAyddtaEV9" },
  ] },
]

[project.theme]
variant = "modern"
custom_dir = "docs-overrides"
logo = "assets/images/mark.svg"
favicon = "assets/images/mark.svg"
font = false
features = ["navigation.path", "navigation.instant", "navigation.instant.progress", "navigation.top", "navigation.footer", "toc.follow", "content.code.copy", "content.tabs.link", "search.highlight", "search.suggest"]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle = { icon = "lucide/sun", name = "Switch to light mode" }

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle = { icon = "lucide/moon", name = "Switch to dark mode" }

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc = { permalink = true }
"clab_docs.topology" = {}
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.superfences" = {}
"pymdownx.inlinehilite" = {}
"pymdownx.details" = {}
"pymdownx.tabbed" = { alternate_style = true }
"pymdownx.blocks.admonition" = {}
"pymdownx.blocks.details" = {}
"pymdownx.blocks.tab" = { alternate_style = true }
"pymdownx.keys" = {}
"pymdownx.emoji" = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }
