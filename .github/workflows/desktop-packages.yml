name: Desktop packages

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: desktop-packages
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'release' || (github.repository == 'srl-labs/containerlab-app' && startsWith(github.event.release.tag_name, 'desktop-v'))
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter containerlab-app --ignore-scripts
      - run: node scripts/check-release-version.mjs ${{ github.event_name == 'release' && 'desktop' || '' }}

  desktop-packages:
    needs: validate
    uses: ./.github/workflows/desktop-builds.yml

  publish-release:
    name: Publish release assets
    if: github.event_name == 'release'
    needs: desktop-packages
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mapfile -t artifacts < <(find release-assets -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.exe' \) -print)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No desktop package artifacts found" >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber
