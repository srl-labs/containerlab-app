name: Desktop packages

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "!vscode-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: "24"

jobs:
  desktop-packages:
    uses: ./.github/workflows/desktop-builds.yml

  publish-release:
    name: Publish release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: desktop-packages
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t artifacts < <(find release-assets -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.exe' \) -print)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No desktop package artifacts found" >&2
            exit 1
          fi

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Containerlab desktop package artifacts for $GITHUB_REF_NAME."
          fi

          gh release upload "$GITHUB_REF_NAME" "${artifacts[@]}" --clobber
