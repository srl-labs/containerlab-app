name: Deploy browser sandbox

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-sandbox-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}

jobs:
  deploy:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CLOUDFLARE_PAGES_PROJECT_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate project name
        run: '[[ "$PROJECT_NAME" =~ ^[a-z0-9][a-z0-9-]{0,57}[a-z0-9]$ || "$PROJECT_NAME" =~ ^[a-z0-9]$ ]]'

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Select commit preview
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "SANDBOX_COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"
          echo "SANDBOX_BRANCH=${COMMIT_SHA:0:12}-pr" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          standalone: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build browser sandbox
        run: pnpm run build:sandbox

      - name: Prepare Cloudflare CLI directory
        run: |
          mkdir -p "$RUNNER_TEMP/cloudflare-sandbox"
          echo '{"private":true}' > "$RUNNER_TEMP/cloudflare-sandbox/package.json"

      - name: Deploy sandbox to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.1"
          packageManager: npm
          workingDirectory: ${{ runner.temp }}/cloudflare-sandbox
          command: pages deploy "${{ github.workspace }}/apps/web/dist/client" --project-name=${{ env.PROJECT_NAME }} --branch=${{ env.SANDBOX_BRANCH }} --commit-hash=${{ github.event.pull_request.head.sha }}

      - name: Comment sandbox URL on PR
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        with:
          script: |
            const sha = process.env.SANDBOX_COMMIT_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha)) {
              throw new Error("Missing or invalid sandbox commit SHA");
            }
            const preview = new URL(process.env.PREVIEW_URL);
            if (preview.protocol !== "https:" || !/^[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev$/.test(preview.hostname) ||
                preview.username || preview.password || preview.port || preview.pathname !== "/" || preview.search || preview.hash) {
              throw new Error("Cloudflare did not return a valid Pages preview URL");
            }
            await core.summary.addLink("Browser sandbox", preview.href).write();
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.state !== "open" || pr.head.sha !== sha) {
              core.info("Skipping preview comment for a closed PR or superseded commit.");
              return;
            }
            const marker = "<!-- containerlab-sandbox-preview -->";
            const body = [
              marker,
              `**Browser sandbox:** [Open preview](${preview.href})`,
              `Commit: ${sha}`
            ].join("\n\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
