name: Deploy browser sandbox

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_ZONE_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-sandbox-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}

jobs:
  deploy:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CLOUDFLARE_PAGES_PROJECT_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate project name
        run: '[[ "$PROJECT_NAME" =~ ^[a-z0-9][a-z0-9-]{0,57}[a-z0-9]$ || "$PROJECT_NAME" =~ ^[a-z0-9]$ ]]'

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Select commit preview
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "SANDBOX_COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"
          echo "SANDBOX_BRANCH=${COMMIT_SHA:0:12}-pr" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          standalone: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build browser sandbox
        run: pnpm run build:sandbox

      - name: Test hostname configuration
        run: node --test scripts/configure-sandbox-domain.test.mjs

      - name: Prepare Cloudflare CLI directory
        run: |
          mkdir -p "$RUNNER_TEMP/cloudflare-sandbox"
          echo '{"private":true}' > "$RUNNER_TEMP/cloudflare-sandbox/package.json"

      - name: Deploy sandbox to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.1"
          packageManager: npm
          workingDirectory: ${{ runner.temp }}/cloudflare-sandbox
          command: pages deploy "${{ github.workspace }}/apps/web/dist/client" --project-name=${{ env.PROJECT_NAME }} --branch=${{ env.SANDBOX_BRANCH }} --commit-hash=${{ github.event.pull_request.head.sha }}

      - name: Configure commit hostname
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PAGES_PREVIEW_URL: ${{ steps.cloudflare.outputs.pages-deployment-alias-url }}
        run: node scripts/configure-sandbox-domain.mjs
