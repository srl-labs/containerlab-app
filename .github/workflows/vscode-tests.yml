name: VS Code extension tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package:vscode
      - run: pnpm --filter vscode-containerlab run test:unit
      - run: xvfb-run -a pnpm run test:e2e:vscode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-extension
          path: |
            apps/vscode-containerlab/*.vsix
            apps/vscode-containerlab/mochawesome-report/
            apps/vscode-containerlab/out/e2e/
