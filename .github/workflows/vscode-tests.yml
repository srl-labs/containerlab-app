name: VS Code extension tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:vscode
      - run: npm run test:unit --workspace vscode-containerlab
      - run: xvfb-run -a npm run test:e2e:vscode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-extension
          path: |
            apps/vscode-containerlab/*.vsix
            apps/vscode-containerlab/mochawesome-report/
            apps/vscode-containerlab/out/e2e/
