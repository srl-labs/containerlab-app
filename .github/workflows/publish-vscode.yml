name: VS Code extension release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run on the main repository, not on forks
    if: github.repository == 'srl-labs/containerlab-app' && startsWith(github.event.release.tag_name, 'vscode-v')
    permissions:
      contents: write
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate version
        id: version
        run: |
          npm run check:release-version
          echo "package=$(node -p "require('./apps/vscode-containerlab/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build shared UI
        run: npm run build:clab-ui

      - name: Run linter
        run: npm run lint --workspace vscode-containerlab

      - name: Run type check
        run: npm run typecheck --workspace vscode-containerlab

      - name: Run tests
        run: npm test --workspace vscode-containerlab

      - name: Build extension
        run: npm run build:vscode

      - name: Package extension
        working-directory: apps/vscode-containerlab
        run: npx vsce package --no-dependencies -o "vscode-containerlab-${{ steps.version.outputs.package }}.vsix"

      - name: Check for publish tokens
        id: check-pat
        run: |
          if [ -n "${{ secrets.VSCE_PAT }}" ]; then
            echo "has_vsce_pat=true" >> $GITHUB_OUTPUT
          else
            echo "has_vsce_pat=false" >> $GITHUB_OUTPUT
            echo "⚠️ VSCE_PAT secret not configured - skipping marketplace publish"
          fi

          if [ -n "${{ secrets.OVSX_PAT }}" ]; then
            echo "has_ovsx_pat=true" >> $GITHUB_OUTPUT
          else
            echo "has_ovsx_pat=false" >> $GITHUB_OUTPUT
            echo "⚠️ OVSX_PAT secret not configured - skipping Open VSX publish"
          fi

      - name: Publish to VS Code Marketplace
        if: steps.check-pat.outputs.has_vsce_pat == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        working-directory: apps/vscode-containerlab
        run: npx vsce publish --packagePath "vscode-containerlab-${{ steps.version.outputs.package }}.vsix" -p "$VSCE_PAT"

      - name: Publish to Open VSX Registry
        if: steps.check-pat.outputs.has_ovsx_pat == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        working-directory: apps/vscode-containerlab
        run: npx ovsx publish --packagePath "vscode-containerlab-${{ steps.version.outputs.package }}.vsix" -p "$OVSX_PAT"

      - name: Upload VSIX to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/vscode-containerlab/vscode-containerlab-${{ steps.version.outputs.package }}.vsix
          fail_on_unmatched_files: true
