name: Publish clab-ui

on:
  push:
    tags:
      - "clab-ui-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          registry-url: https://npm.pkg.github.com
          scope: "@srl-labs"
          cache: pnpm

      - name: Verify tag matches clab-ui version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#clab-ui-v}"
          PACKAGE_VERSION="$(node -p "require('./packages/clab-ui/package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match clab-ui package version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck clab-ui
        run: pnpm run typecheck:clab-ui

      - name: Test clab-ui
        run: pnpm --filter @srl-labs/clab-ui run test:unit

      - name: Preview package
        run: pnpm run pack:clab-ui --dry-run

      - name: Publish to GitHub Packages
        run: pnpm --filter @srl-labs/clab-ui publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
