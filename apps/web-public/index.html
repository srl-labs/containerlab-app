<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%containerlab.svg" />
    <title>Containerlab Web</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        background-color: var(--vscode-editor-background);
        color: var(--vscode-editor-foreground);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      .startup-fallback {
        align-items: center;
        background: #000000;
        display: flex;
        height: 100%;
        inset: 0;
        justify-content: center;
        position: fixed;
        width: 100%;
      }

      .startup-fallback img {
        display: block;
        height: 136px;
        width: 136px;
      }

      #root:has(> *) ~ .startup-fallback {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="settings-overlay"></div>
    <div id="root"></div>
    <div class="startup-fallback">
      <img src="%BASE_URL%clab-animated-no-logo.svg" alt="Containerlab" width="136" height="136" />
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
